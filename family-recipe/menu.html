<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>已点菜单</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://holcjoihioqzjauoewbw.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhvbGNqb2loaW9xemphdW9ld2J3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzE2NDkwNTksImV4cCI6MjA4NzIyNTA1OX0.XBnC9Vug155Dmf77CkwhOmwjaaEOA597J-OdMlohTlU';
        window.db = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    </script>
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="navbar">
        <button class="back-btn" onclick="goBack()">
            <i class="fas fa-arrow-left"></i>
        </button>
        <h1 class="app-title">已点菜单</h1>
        <button class="history-btn" onclick="goToHistory()">
            <i class="fas fa-history"></i>
        </button>
    </header>

    <!-- 主内容区域 -->
    <main class="menu-content">
        <!-- 统计模块 -->
        <div class="menu-stats" id="menuStats" style="display: none;">
            <div class="stat-card">
                <div class="stat-number" id="totalDishes">0</div>
                <div class="stat-label">总菜品</div>
            </div>
            <div class="stat-divider"></div>
            <div class="stat-card" id="categoryStats">
                <!-- 分类统计将动态添加 -->
            </div>
        </div>

        <!-- 菜单列表 -->
        <div class="menu-list" id="menuList">
            <!-- 菜单列表将通过JavaScript动态添加 -->
        </div>

        <!-- 空状态 -->
        <div class="empty-state" id="emptyState">
            <i class="fas fa-plate-wheat empty-icon"></i>
            <p class="empty-text">还没有点菜，赶紧去选菜吧！</p>
        </div>
    </main>

    <!-- 确认按钮 -->
    <div class="confirm-section" id="confirmSection" style="display: none;">
        <button class="confirm-btn" id="confirmBtn">
            <i class="fas fa-check"></i>
            确认菜单
        </button>
    </div>

    <!-- 底部导航栏 -->
    <nav class="bottom-nav">
        <div class="nav-item" id="navHome">
            <i class="fas fa-home"></i>
            <span>首页</span>
        </div>
        <div class="nav-item active" id="navMenu">
            <i class="fas fa-list"></i>
            <span>已点菜单</span>
            <div class="nav-badge" id="menuBadge" style="display: none;">0</div>
        </div>
    </nav>

    <!-- Toast提示 -->
    <div class="toast" id="toast"></div>

    <script src="menu.js"></script>
</body>
</html>
